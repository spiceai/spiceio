name: Setup spiceio
description: Install a released version of spiceio and start the S3-to-SMB proxy

inputs:
  version:
    description: Release tag to install (e.g. "v0.7.0"). Use "latest" for the most recent release.
    required: false
    default: v0.7.0
  smb-url:
    description: >
      SMB connection URL: smb://user:pass@server/share or smb://user:pass@server:port/share.
      Password can also be provided separately via smb-pass.
    required: true
  smb-pass:
    description: SMB password (overrides password in smb-url if both provided)
    required: false
    default: ""
  bucket:
    description: Virtual S3 bucket name
    required: false
    default: spiceio
  region:
    description: AWS region to advertise
    required: false
    default: us-east-1
  bind:
    description: Listen address for the S3 endpoint
    required: false
    default: "127.0.0.1:8333"
  connections:
    description: SMB connection-pool size (caps concurrent NAS sessions per instance)
    required: false
    default: "8"
  immutable-objects:
    description: >
      When "true" or "1", enable SPICEIO_IMMUTABLE_OBJECTS — serve a cached body
      by key with no SMB round trip at all. Correct for content-addressed stores
      such as sccache, where the key is a hash of the content and nothing can put
      different bytes under it; leave off for mutable S3 keys, where it would
      also stop noticing a delete. This is the single largest performance
      setting: measured 23x read throughput against revalidating every hit.
    required: false
    default: "false"
  cache-bytes:
    description: >
      SPICEIO_OBJECT_CACHE_BYTES — max resident bytes for the GET body cache.
      Empty uses spiceio's own default, which is 8 GiB. Runners that are also
      compiling should set this explicitly: the cache is the main throughput
      lever, but it is resident memory competing with the build. The configured
      budget is logged at startup and the achieved hit rate at shutdown.
    required: false
    default: ""
  write-back:
    description: >
      SPICEIO_WRITE_BACK — acknowledge PutObject from memory and write to the
      NAS in the background. Empty uses spiceio's own default, which is on.
      Set "false" on a runner that cannot tolerate losing the last few writes:
      the acknowledgement precedes the backend write, and a job that ends
      before the drain takes its unflushed writes with it. For an sccache
      cache that costs a recompile next build, which is usually the right
      trade on CI; for anything treated as a system of record it is not.
    required: false
    default: ""
  spill-dir:
    description: >
      SPICEIO_SPILL_DIR — machine-wide disk tier behind the memory cache.
      Empty uses spiceio's own default (/var/tmp/spiceio-cache); "off"
      disables it. On an ephemeral runner the directory does not outlive the
      job, so it only helps when several spiceio instances share the host.
    required: false
    default: ""
  spill-bytes:
    description: >
      SPICEIO_SPILL_BYTES — disk budget for the spill directory, shared by
      every instance on the host. Empty uses spiceio's own default of 64 GiB,
      which is already clamped to leave at least 10 GiB free and to half the
      space above that. Set it lower on a runner whose disk the build needs.
    required: false
    default: ""
  token:
    description: GitHub token for downloading release assets from private repos
    required: true

outputs:
  endpoint:
    description: The S3-compatible endpoint URL
    value: ${{ steps.start.outputs.endpoint }}
  pid:
    description: PID of the spiceio process (use to stop it at the end of your workflow)
    value: ${{ steps.start.outputs.pid }}

runs:
  using: composite
  steps:
    - name: Download and install spiceio
      id: install
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail

        REPO="spiceai/spiceio"
        INSTALL_DIR="${RUNNER_TEMP}/spiceio-bin"
        ASSET="spiceio-${RUNNER_OS}-${RUNNER_ARCH}.tar.gz"
        VERSION="${{ inputs.version }}"

        mkdir -p "$INSTALL_DIR"

        if [[ "$VERSION" == "latest" ]]; then
          gh release download --repo "$REPO" --pattern "$ASSET" --pattern "${ASSET}.sha256" --dir "$INSTALL_DIR"
        else
          gh release download "$VERSION" --repo "$REPO" --pattern "$ASSET" --pattern "${ASSET}.sha256" --dir "$INSTALL_DIR"
        fi

        # Verify integrity
        cd "$INSTALL_DIR"
        shasum -a 256 -c "${ASSET}.sha256"

        tar xzf "$ASSET" -C "$INSTALL_DIR"
        chmod +x "$INSTALL_DIR/spiceio"
        echo "$INSTALL_DIR" >> "$GITHUB_PATH"

    - name: Start spiceio
      id: start
      shell: bash
      env:
        SMB_URL: ${{ inputs.smb-url }}
        SMB_PASS_OVERRIDE: ${{ inputs.smb-pass }}
        SPICEIO_BUCKET: ${{ inputs.bucket }}
        SPICEIO_REGION: ${{ inputs.region }}
        SPICEIO_BIND: ${{ inputs.bind }}
        SPICEIO_SMB_CONNECTIONS: ${{ inputs.connections }}
        IMMUTABLE_OBJECTS: ${{ inputs.immutable-objects }}
        CACHE_BYTES: ${{ inputs.cache-bytes }}
        WRITE_BACK: ${{ inputs.write-back }}
        SPILL_DIR: ${{ inputs.spill-dir }}
        SPILL_BYTES: ${{ inputs.spill-bytes }}
      run: |
        set -euo pipefail

        # Parse smb://user:pass@server:port/share
        # Strips the smb:// prefix, then splits on :, @, /
        URL="${SMB_URL#smb://}"

        USERINFO="${URL%%@*}"
        HOSTPATH="${URL#*@}"

        SPICEIO_SMB_USER="${USERINFO%%:*}"
        # Extract password from URL only if user:pass@ format is used
        if [[ "$USERINFO" == *:* ]]; then
          URL_PASS="${USERINFO#*:}"
        else
          URL_PASS=""
        fi
        # smb-pass input takes priority, then URL password
        if [[ -n "$SMB_PASS_OVERRIDE" ]]; then
          SPICEIO_SMB_PASS="$SMB_PASS_OVERRIDE"
        elif [[ -n "$URL_PASS" ]]; then
          SPICEIO_SMB_PASS="$URL_PASS"
        else
          echo "::error::No SMB password provided (use smb-pass input or include in smb-url)"
          exit 1
        fi

        HOSTPORT="${HOSTPATH%%/*}"
        SPICEIO_SMB_SHARE="${HOSTPATH#*/}"

        if [[ "$HOSTPORT" == *:* ]]; then
          SPICEIO_SMB_SERVER="${HOSTPORT%%:*}"
          SPICEIO_SMB_PORT="${HOSTPORT#*:}"
        else
          SPICEIO_SMB_SERVER="$HOSTPORT"
          SPICEIO_SMB_PORT="445"
        fi

        # Normalize immutable-objects: accept true/1/yes (case-insensitive).
        # Portable (no ${var,,}) for macOS bash 3.2.
        case "$(printf '%s' "$IMMUTABLE_OBJECTS" | tr '[:upper:]' '[:lower:]')" in
          1|true|yes) SPICEIO_IMMUTABLE_OBJECTS=1 ;;
          *)          SPICEIO_IMMUTABLE_OBJECTS=0 ;;
        esac

        export SPICEIO_SMB_SERVER SPICEIO_SMB_PORT SPICEIO_SMB_USER SPICEIO_SMB_PASS SPICEIO_SMB_SHARE
        export SPICEIO_BUCKET SPICEIO_REGION SPICEIO_BIND SPICEIO_SMB_CONNECTIONS
        export SPICEIO_IMMUTABLE_OBJECTS

        # Only export when set, so an empty input leaves spiceio's own default
        # in place rather than pinning the cache to zero bytes.
        if [[ -n "$CACHE_BYTES" ]]; then
          export SPICEIO_OBJECT_CACHE_BYTES="$CACHE_BYTES"
        fi
        if [[ -n "$SPILL_DIR" ]]; then
          export SPICEIO_SPILL_DIR="$SPILL_DIR"
        fi
        if [[ -n "$SPILL_BYTES" ]]; then
          export SPICEIO_SPILL_BYTES="$SPILL_BYTES"
        fi
        # Same normalization as immutable-objects, but only when the input is
        # non-empty: spiceio's default is on, so an unset input must not be
        # turned into an explicit 0.
        if [[ -n "$WRITE_BACK" ]]; then
          case "$(printf '%s' "$WRITE_BACK" | tr '[:upper:]' '[:lower:]')" in
            1|true|yes) export SPICEIO_WRITE_BACK=1 ;;
            *)          export SPICEIO_WRITE_BACK=0 ;;
          esac
        fi

        SPICEIO_LOG="${RUNNER_TEMP}/spiceio.log"
        : > "$SPICEIO_LOG"
        export SPICEIO_LOG_FILE="$SPICEIO_LOG"

        spiceio &
        PID=$!

        # Wait for spiceio to be fully ready (SMB connected), not merely
        # accepting TCP. The process binds early and serves 503 until the
        # NAS is up; sccache's `.sccache_check` must hit a 200, not a refuse
        # and not a still-connecting 503.
        #
        # Prefer the "ready, listening on" log line (written after SMB is
        # live). Fall back to "accepting connections" + a successful 200
        # probe so older binaries without the ready line still work.
        echo "Waiting for spiceio on ${SPICEIO_BIND}..."
        ENDPOINT=""
        for i in $(seq 1 150); do
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "::error::spiceio exited unexpectedly"
            echo "::group::spiceio log"
            cat "$SPICEIO_LOG" 2>/dev/null || echo "(log file missing)"
            echo "::endgroup::"
            exit 1
          fi
          # Prefer the post-SMB ready line; fall back to accepting-connections.
          ENDPOINT=$(
            grep -E 'ready, listening on|accepting connections on' "$SPICEIO_LOG" 2>/dev/null \
              | grep -o 'http://[^ ]*' | tail -1 || true
          )
          READY_LINE=$(grep -c 'ready, listening on' "$SPICEIO_LOG" 2>/dev/null || echo 0)
          if [[ -n "$ENDPOINT" ]]; then
            # HTTP 200 on the root (list buckets) means SMB is serving.
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 2 "$ENDPOINT/" 2>/dev/null || echo 000)
            if [[ "$CODE" == "200" ]] || [[ "$READY_LINE" -gt 0 && "$CODE" != "000" && "$CODE" != "503" ]]; then
              # Verify a write/read round-trip that mirrors sccache's
              # `.sccache_check` so we never hand a half-ready endpoint to
              # clients that fail hard on temporary storage errors.
              CHECK_KEY="${SPICEIO_BUCKET}/.spiceio_ready_check"
              PUT_CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 \
                -X PUT --data-binary 'ok' -H 'Content-Length: 2' \
                "${ENDPOINT}/${CHECK_KEY}" 2>/dev/null || echo 000)
              GET_CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 \
                "${ENDPOINT}/${CHECK_KEY}" 2>/dev/null || echo 000)
              curl -sS -o /dev/null -X DELETE --max-time 5 \
                "${ENDPOINT}/${CHECK_KEY}" 2>/dev/null || true
              if [[ "$PUT_CODE" == "200" && "$GET_CODE" == "200" ]]; then
                echo "spiceio ready at $ENDPOINT (PID $PID)"
                echo "endpoint=$ENDPOINT" >> "$GITHUB_OUTPUT"
                echo "pid=$PID" >> "$GITHUB_OUTPUT"
                # Export for subsequent steps (sccache, aws cli) so they do not
                # hard-code a port that auto-increment may have moved.
                {
                  echo "SCCACHE_ENDPOINT=$ENDPOINT"
                  echo "AWS_ENDPOINT_URL=$ENDPOINT"
                } >> "$GITHUB_ENV"
                exit 0
              fi
            fi
          fi
          sleep 1
        done
        echo "::error::spiceio failed to start within 150s"
        echo "::group::spiceio log"
        cat "$SPICEIO_LOG" 2>/dev/null || echo "(log file missing)"
        echo "::endgroup::"
        kill "$PID" 2>/dev/null || true
        exit 1

