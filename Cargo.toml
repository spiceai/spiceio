[package]
name = "spiceio"
version = "0.11.0"
edition = "2024"
description = "S3-compatible API proxy to SMB file shares"
license = "Apache-2.0"

[lib]
name = "spiceio"
path = "src/lib.rs"

[[bin]]
name = "spiceio"
path = "src/main.rs"

# sccache-shaped load generator used by scripts/bench-sccache.sh. Behind a
# feature so `make release` never builds it into the shipped artifact set,
# while `--all-features` (what CI lints with) still type-checks it.
[[bin]]
name = "spiceio-loadgen"
path = "src/bin/loadgen.rs"
required-features = ["loadgen"]

# Live sccache NAS durability checker used by scripts/test-sccache.sh.
# Same feature gate as loadgen: `make release` does not ship it.
[[bin]]
name = "spiceio-sccache-nas"
path = "src/bin/sccache_nas.rs"
required-features = ["loadgen"]

[features]
loadgen = []

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "signal", "sync", "time"] }
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "http2", "server-graceful"] }
http-body = "1"
http-body-util = "0.1"
http = "1"
bytes = "1"
percent-encoding = "2"
# TLS for the OTLP/gRPC exporter. native-tls is Security.framework on macOS,
# matching the "use OS APIs" rule; the `alpn` feature is required to negotiate
# HTTP/2 with Spice Cloud apps.
native-tls = { version = "0.2", features = ["alpn"] }
tokio-native-tls = "0.3"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "crypto_bench"
harness = false

[[bench]]
name = "protocol_bench"
harness = false

[[bench]]
name = "s3_bench"
harness = false

[lints.rust]
warnings = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
cargo_common_metadata = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
# Crash diagnostics for stripped builds: emit line tables into a separate
# dSYM bundle (target/release/spiceio.dSYM) so the raw addresses in crash
# reports can be symbolized offline with `atos`. The shipped binary is
# unchanged — still stripped, and line tables do not affect codegen.
debug = "line-tables-only"
split-debuginfo = "packed"
